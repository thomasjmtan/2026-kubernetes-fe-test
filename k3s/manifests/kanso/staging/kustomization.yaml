apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kanso-staging
resources:
  - ../base
  - namespace.yaml
replicas:
  - name: kanso-web
    count: 1
patches:
  - target:
      kind: Ingress
      name: kanso-web
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: staging.kanso.localhost
