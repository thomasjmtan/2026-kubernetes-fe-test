services:
  kanso-web:
    build:
      context: .
      args:
        VERSION: ${KANSO_VERSION:-dev}
    image: kanso-web:dev
    container_name: kanso-web
    ports:
      - "${KANSO_PORT:-8088}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
