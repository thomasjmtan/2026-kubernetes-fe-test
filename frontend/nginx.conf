server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Browsers re-check every file on each load (a cheap 304 when unchanged),
    # so a new deploy shows up without a hard refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }

    location = /version.txt {
        add_header Cache-Control "no-store";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
